<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IRIDESCENT">
<meta name="application-name" content="IRIDESCENT">
<meta name="theme-color" content="#0b0c0f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-32.png">
<title>IRIDESCENT</title>
<style>
:root{--ink:#1d1f24;--ink2:#4a4f58;--line:#8d939c;--red:#cb4a36;--led-off:#b9bdc4;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;--sans:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --pcb:none;--sheet:linear-gradient(rgba(240,242,244,.8),rgba(234,237,240,.8))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b0c0f;overflow:hidden;overscroll-behavior:none;touch-action:none;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:var(--sans)}
#glow{display:none;position:fixed;inset:-18%;pointer-events:none;opacity:0;filter:blur(90px) saturate(1.25);transition:opacity 1.2s ease,background 1.2s ease}
#turn{position:fixed;left:max(14px,calc(env(safe-area-inset-left) + 10px));top:14px;z-index:90;display:none;padding:7px 14px;border-radius:99px;background:rgba(20,22,26,.78);border:1px solid rgba(255,255,255,.18);color:#e9ecef;font:700 10px/1 'SF Mono',ui-monospace,Menlo,monospace;letter-spacing:.14em;pointer-events:none;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#desk{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 30%,#1d1f24 0%,#0b0c0e 60%,#040405 100%)}
#stage{position:absolute;left:0;top:0;width:1000px;height:500px;transform-origin:0 0}

/* body: frosted plastic over a PCB, chrome rim */
#chassis{position:absolute;inset:0;border-radius:18px;overflow:hidden;background:#d5d9de;
  box-shadow:0 0 0 3px #17181c,inset 0 0 0 1px rgba(255,255,255,.9)}
#chassis::before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:18px;z-index:50;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.85),inset 0 0 40px rgba(255,255,255,.35)}
.rim{position:absolute;left:-11px;top:-11px;right:-11px;bottom:-11px;border-radius:29px;pointer-events:none;
  background:linear-gradient(115deg,#fdfdfe 0%,#a6abb3 14%,#f4f5f7 28%,#838993 44%,#eef0f2 58%,#9aa0a9 74%,#fafbfb 88%,#b3b8bf 100%);
  box-shadow:0 34px 48px rgba(0,0,0,.6),0 8px 14px rgba(0,0,0,.5),inset 0 0 0 1px rgba(0,0,0,.55),inset 0 1px 0 #fff}
.pcb{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.3}   /* the board is felt through the frost, not read */
.frost{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(160deg,rgba(238,240,243,.62) 0%,rgba(228,231,235,.55) 55%,rgba(220,224,228,.62) 100%)}
.frost::after{content:"";position:absolute;inset:0;
  background:linear-gradient(118deg,rgba(255,255,255,.38) 0%,rgba(255,255,255,0) 22%,rgba(255,255,255,0) 60%,rgba(255,255,255,.16) 72%,rgba(255,255,255,0) 84%)}
.haze{position:absolute;pointer-events:none;border-radius:10px;background:rgba(232,235,238,.92);box-shadow:0 0 9px 6px rgba(232,235,238,.9)}
.haze.round{border-radius:50%;box-shadow:0 0 10px 8px rgba(232,235,238,.92)}
.groove{position:absolute;left:0;right:0;height:1px;background:var(--line)}
.screw{position:absolute;width:14px;height:14px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#f7f8f9,#b7bcc3 60%,#7d838c);
  box-shadow:0 1px 0 rgba(255,255,255,.8),0 2px 3px rgba(0,0,0,.4),inset 0 0 0 1px rgba(0,0,0,.3)}
.screw::after{content:"";position:absolute;left:2px;right:2px;top:6px;height:2px;border-radius:1px;background:#3d3f46;
  box-shadow:0 1px 0 rgba(255,255,255,.5);transform:rotate(var(--r,0deg))}
.redsq{position:absolute;width:8px;height:8px;background:var(--red);box-shadow:0 0 6px rgba(203,74,54,.55)}

/* labels: technical mono, with a halo so the board never swallows them */
.lab{position:absolute;white-space:nowrap;font:600 8.5px/1 var(--mono);letter-spacing:.06em;color:var(--ink);text-transform:uppercase;
  pointer-events:none;transform:translate(-50%,-50%);text-shadow:0 0 2px #eef0f3,0 0 2px #eef0f3,0 0 3px #eef0f3,0 0 4px #eef0f3,0 0 6px #eef0f3,0 0 8px #eef0f3}
.lab.sm{font-size:8px;letter-spacing:.04em}
.lab.lg{font-size:10px}

/* dot-matrix display */
.dm{position:absolute;border-radius:10px;background:#070708;pointer-events:none;
  box-shadow:0 0 0 2px #c3c7cd,0 0 0 3px #7e848d,0 3px 8px rgba(30,36,46,.35),inset 0 0 12px rgba(0,0,0,.9)}
.dmglass{position:absolute;inset:0;border-radius:10px;
  background:linear-gradient(155deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,0) 34%),linear-gradient(0deg,rgba(255,255,255,.04),rgba(255,255,255,0) 40%)}
/* LEDs: small round dots, red when lit */
.led{position:absolute;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:var(--led-off);
  box-shadow:inset 0 0 0 1px #9fa5ad,0 0 0 2.5px rgba(232,235,238,.92)}
.led.on{background:radial-gradient(circle at 42% 34%,#fff4f1 0%,#e0604b 40%,#cb4a36 100%);
  box-shadow:0 0 0 2.5px rgba(232,235,238,.92),0 0 4px 1px rgba(203,74,54,.75),0 0 10px 3px rgba(203,74,54,.3)}
.led.cur{animation:cur .5s steps(1) infinite}
@keyframes cur{50%{background:radial-gradient(circle at 42% 34%,#ffe7b8 0%,#ffa42a 40%,#c25a00 100%);box-shadow:0 0 0 2.5px rgba(232,235,238,.92),0 0 5px 2px rgba(255,160,40,.8)}}
/* knobs: matte white caps with concentric rings and a red index */
.knob{position:absolute;touch-action:none;cursor:ns-resize}
.knob::before{content:"";position:absolute;inset:-12px;border-radius:50%}
.kticks{position:absolute;pointer-events:none;overflow:visible}
.kticks line{stroke:var(--ink2);stroke-width:2.4px;stroke-dasharray:.01 12;stroke-linecap:round}
.kshadow{position:absolute;inset:-2%;border-radius:50%;transform:translate(6%,10%);pointer-events:none;
  background:radial-gradient(circle,rgba(40,46,56,.26) 55%,rgba(0,0,0,0) 74%)}
.kbase{position:absolute;inset:-5%;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,#c9cdd2 0,#c9cdd2 88%,#8f959e 93%,#e9ebee 97%,rgba(0,0,0,0) 100%)}
.kbody{position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 40% 30%,#fff 0%,#eceef0 55%,#d6d9de 100%);
  box-shadow:0 2px 4px rgba(50,56,66,.35),0 0 0 1px #a3a9b1,inset 0 0 0 1px rgba(255,255,255,.9)}
.krot{position:absolute;inset:0;border-radius:50%;transition:transform .07s ease-out}
.knob.st .krot{transition:transform .17s cubic-bezier(.3,1.55,.5,1)}
.kcap{position:absolute;inset:15%;border-radius:50%;
  background:repeating-radial-gradient(circle at 50% 50%,#f7f8f9 0 1.1px,#dfe2e6 1.1px 2.3px);
  box-shadow:inset 0 0 0 1px #c3c8ce,inset 1px 1.5px 1px rgba(255,255,255,.9),0 1px 2px rgba(50,56,66,.35)}
.kind{position:absolute;left:50%;top:3%;width:6.5%;height:22%;transform:translateX(-50%);border-radius:1px;background:var(--red)}
.kgloss{position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:radial-gradient(ellipse 50% 30% at 36% 19%,rgba(255,255,255,.55),rgba(255,255,255,0) 70%)}
.knob.active .kshadow{transform:translate(4%,7%)}
/* glass knobs */
.kbase{background:radial-gradient(circle,rgba(255,255,255,.0) 0,rgba(255,255,255,.0) 86%,rgba(120,130,142,.45) 92%,rgba(255,255,255,.7) 97%,rgba(0,0,0,0) 100%)}
.kshadow{background:radial-gradient(circle,rgba(60,70,84,.2) 55%,rgba(0,0,0,0) 74%)}
.kbody{background:radial-gradient(circle at 38% 28%,rgba(255,255,255,.75) 0%,rgba(236,240,244,.42) 45%,rgba(206,214,222,.38) 100%);
  box-shadow:0 2px 5px rgba(50,60,72,.3),0 0 0 1px rgba(130,140,152,.85),inset 0 0 0 2px rgba(255,255,255,.75),inset 0 -5px 8px rgba(150,170,190,.35)}
.kcap{inset:19%;background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.1) 0 38%,rgba(255,255,255,.55) 40%,rgba(200,210,220,.3) 62%,rgba(255,255,255,.65) 100%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.9),inset 0 0 0 3px rgba(150,162,176,.28),0 1px 2px rgba(50,60,72,.3)}
.kind{top:1%;width:5.5%;height:26%;background:linear-gradient(var(--red),#c82612)}
/* buttons: flat matte pads */
.btn{position:absolute;border-radius:7px;touch-action:none;cursor:pointer;display:flex;align-items:center;justify-content:center;
  font:700 12px/1 var(--mono);letter-spacing:.04em;color:var(--ink);
  background:linear-gradient(180deg,#f6f7f8 0%,#eceef0 50%,#e2e5e8 100%);
  box-shadow:0 2px 0 #a8aeb6,0 4px 6px rgba(50,56,66,.2),inset 0 0 0 1px #b8bdc4}
.btn::before{content:"";position:absolute;inset:-14px -6px -10px -6px}
.btn.down{transform:translateY(1.5px);box-shadow:0 .5px 0 #a8aeb6,inset 0 0 0 1px #9aa0a8}
.btn.dark{color:#f4f5f7;background:linear-gradient(180deg,#2a2c31 0%,#1d1f23 45%,#141518 100%);
  box-shadow:0 2px 0 #000,0 4px 6px rgba(0,0,0,.3),inset 0 0 0 1px #3a3d44}
.btn.dark.down{box-shadow:0 .5px 0 #000,inset 0 0 0 1px #3a3d44}
.btn.pad{font-size:15px;font-weight:600;color:#7a8390}
.btn.pad.set{color:#c4361b}
.btn.grey{background:linear-gradient(180deg,#d3d7dc 0%,#c5cad0 50%,#b8bdc4 100%);
  box-shadow:0 2px 0 #8b919a,0 4px 6px rgba(50,56,66,.2),inset 0 0 0 1px #aab0b8}
.btn.grey.down{box-shadow:0 .5px 0 #8b919a,inset 0 0 0 1px #9aa0a8}
.slot{position:absolute;border-radius:6px;background:#cdd1d6;box-shadow:inset 0 1px 2px rgba(50,56,66,.35);pointer-events:none}

/* contrast pass: light pads read clearly on the coloured sheet */
.btn:not(.dark):not(.grey){background:linear-gradient(180deg,rgba(255,255,255,.66) 0%,rgba(244,246,248,.54) 55%,rgba(226,230,234,.5) 100%);
  box-shadow:0 2px 0 rgba(141,148,157,.85),0 4px 7px rgba(40,50,64,.26),inset 0 0 0 1px rgba(143,150,159,.9),inset 0 1px 0 rgba(255,255,255,.95)}
.btn:not(.dark):not(.grey).down{box-shadow:0 .5px 0 rgba(141,148,157,.85),inset 0 0 0 1px #7f8690,inset 0 2px 4px rgba(40,50,64,.2)}
.btn.grey{background:linear-gradient(180deg,rgba(211,215,220,.66) 0%,rgba(197,202,208,.58) 50%,rgba(184,189,196,.54) 100%);
  box-shadow:0 2px 0 rgba(139,145,154,.9),0 4px 6px rgba(50,56,66,.22),inset 0 0 0 1px rgba(170,176,184,.9),inset 0 1px 0 rgba(255,255,255,.55)}
.sw{position:absolute;width:44px;height:20px;margin:-10px 0 0 -22px;touch-action:none;cursor:pointer}
.sw::before{content:"";position:absolute;inset:-20px -9px}   /* hit area: at least 44 pt tall on a 390 pt wide phone */
.sw .slot2{position:absolute;inset:0;border-radius:3px;background:#17181b;box-shadow:inset 0 1px 3px #000,0 0 0 1.5px #a3a9b1}
.sw .tab{position:absolute;top:-3px;left:2px;width:20px;height:26px;border-radius:3px;
  background:linear-gradient(90deg,#fdfdfe,#e3e5e9);box-shadow:0 2px 3px rgba(50,56,66,.4),inset 0 0 0 1px #b3b9c1;transition:left .09s ease-out}
.sw .tab::after{content:"";position:absolute;left:5px;right:5px;top:6px;bottom:6px;border-radius:1px;
  background:repeating-linear-gradient(90deg,rgba(0,0,0,.18) 0 1.2px,rgba(255,255,255,.7) 1.2px 2.6px)}
.sw.on .tab{left:22px}
svg polyline{stroke:var(--ink)}
#power{position:absolute;inset:0;z-index:80;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:rgba(8,9,12,.82);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);cursor:pointer;color:#e9e9e6;
  font:700 12px/1.3 var(--sans);letter-spacing:.2em;text-transform:uppercase;transition:opacity .35s}
#power.gone{opacity:0;pointer-events:none}
#power .pw{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 38% 28%,#555861,#25272d 70%);box-shadow:0 8px 14px rgba(0,0,0,.6),inset 0 1px 1px rgba(255,255,255,.4),0 0 0 2px #0e0f12,0 0 0 3px rgba(255,255,255,.25)}
#power .pw svg{width:36px;height:36px;stroke:#ff5a45;filter:drop-shadow(0 0 6px rgba(224,90,70,.9))}
#power small{display:block;font-weight:600;letter-spacing:.12em;color:#9ea0a8;text-align:center;text-transform:none;font-size:12px}
@keyframes redflash{50%{opacity:.15}}
/* library sheet — frosted plastic over the board */
[data-id=lib]{font:800 12px/1 var(--mono);letter-spacing:.2em}
#lib{position:absolute;inset:0;z-index:68;border-radius:18px;background-color:#e6e9ec;background-image:var(--sheet),var(--pcb);background-size:100% 100%;
 box-shadow:inset 0 0 0 1px #8f959e,inset 0 0 0 4px #f4f5f7,inset 0 0 0 5px #8f959e;color:#1d1f24;display:none;flex-direction:column;
 padding:22px 30px 20px;font:500 12px/1.3 var(--sans)}
#lib.open{display:flex}
#lib .lh{display:flex;align-items:center;gap:9px;flex:0 0 auto}
#lib .lh{margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #8d939c}
#lib .lt{font:800 18px/1 var(--mono);letter-spacing:.16em;color:#1d1f24;margin-right:auto}
#lib .lb,#lib .tg{padding:10px 14px;border-radius:4px;background:linear-gradient(180deg,#f6f7f8 0%,#eceef0 50%,#e2e5e8 100%);color:#1d1f24;
 font:800 10.5px/1 var(--mono);letter-spacing:.14em;box-shadow:0 3px 0 #a8aeb6,0 5px 6px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.8);
 cursor:pointer;user-select:none;-webkit-user-select:none}
#lib .lb:active{transform:translateY(2px);box-shadow:0 1px 0 #a8aeb6,0 2px 3px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.6)}
#lib .lb.done{background:linear-gradient(180deg,#2a2c31,#1d1f23 55%,#141518);color:#f4f5f7;box-shadow:0 3px 0 #000,0 5px 6px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.22)}
#lib .ll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0;padding:2px 6px 8px 2px}
#lib .row{position:relative;display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:5px;cursor:pointer;
 background:linear-gradient(180deg,rgba(255,255,255,.78),rgba(240,244,248,.55));box-shadow:0 0 0 1px rgba(255,255,255,.85),0 2px 6px rgba(60,72,88,.28),inset 0 1px 0 #fff,inset 0 -6px 10px rgba(150,170,190,.18)}
#lib .row:active{transform:translateY(1px)}
#lib .row.cur{background:linear-gradient(180deg,#2a2c31,#141518);box-shadow:0 2px 0 #000,0 3px 5px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.2)}
#lib .lb,#lib .tg{background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(236,241,246,.6));box-shadow:0 0 0 1px rgba(255,255,255,.85),0 2px 6px rgba(60,72,88,.3),inset 0 1px 0 #fff,inset 0 -5px 8px rgba(150,170,190,.18)}
#lib .lb:active{box-shadow:0 0 0 1px rgba(255,255,255,.85),0 1px 2px rgba(60,72,88,.3),inset 0 1px 3px rgba(60,72,88,.25)}

/* ================= DECK: portrait stage + player organs ================= */
#stage{width:500px;height:1070px}
.vslot{position:absolute;width:14px;border-radius:7px;background:#17181b;pointer-events:none;
  box-shadow:inset 0 1px 3px #000,0 0 0 1.5px #a3a9b1}
.vfader{position:absolute;z-index:4;touch-action:none;cursor:ns-resize;width:56px}
.vfader::before{content:"";position:absolute;inset:0 -14px}
.vtab{position:absolute;left:8px;width:40px;height:56px;border-radius:5px;
  background:linear-gradient(180deg,#fdfdfe,#e3e5e9);
  box-shadow:0 4px 6px rgba(50,56,66,.45),inset 0 0 0 1px #b3b9c1}
.vtab::after{content:"";position:absolute;left:6px;right:6px;top:9px;bottom:9px;border-radius:1px;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,.2) 0 1.2px,rgba(255,255,255,.75) 1.2px 3.2px)}
.vtab i{position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:var(--red);z-index:2}
.vfader.act .vtab{transform:translateY(1px);box-shadow:0 2px 3px rgba(50,56,66,.45),inset 0 0 0 1px #9aa0a8}

.cdwell{position:absolute;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 50% 36%,rgba(120,130,142,.42),rgba(236,239,242,.7) 78%);
  box-shadow:inset 0 5px 11px rgba(40,50,62,.45),0 0 0 1.5px #a3a9b1,0 0 0 4px rgba(255,255,255,.75),0 0 0 5px #8f959e}
.cdmech{position:absolute;border-radius:50%;overflow:hidden;pointer-events:none;opacity:.92}
.cdmech svg{position:absolute;inset:0;width:100%;height:100%}
.cdarm{position:absolute;left:277px;top:277px;width:150px;height:26px;transform-origin:13px 13px;will-change:transform}
.cdarm svg{position:absolute;inset:0;width:100%;height:100%}
.cdwell.land{animation:wellland .5s cubic-bezier(.2,.8,.3,1)}
@keyframes wellland{0%{filter:brightness(1)}28%{filter:brightness(.9)}100%{filter:brightness(1)}}
.cdrot.nx{pointer-events:none;z-index:1;transition:none}
.cdisc{position:absolute;border-radius:50%;touch-action:none;cursor:grab;overflow:hidden;
  box-shadow:0 6px 11px rgba(40,50,62,.4),0 0 0 1px #8f959e,inset 0 0 0 2px rgba(255,255,255,.8)}
.cdrot{position:absolute;inset:0;border-radius:50%;will-change:transform;
  background:
   repeating-radial-gradient(circle,rgba(70,80,92,.07) 0 .8px,rgba(255,255,255,.1) .8px 1.8px),
   conic-gradient(from 25deg,rgba(255,222,208,.66),rgba(212,234,244,.66),rgba(246,230,246,.66),rgba(202,240,235,.66),rgba(255,226,214,.66),rgba(226,214,244,.66),rgba(255,222,208,.66))}
.cdiris{position:absolute;inset:0;border-radius:50%;pointer-events:none;z-index:1;will-change:transform;
  background:conic-gradient(from 18deg,rgba(255,255,255,0) 0deg,rgba(255,112,190,.30) 22deg,rgba(124,160,255,.32) 46deg,rgba(84,232,214,.30) 68deg,rgba(255,240,140,.26) 90deg,rgba(255,255,255,0) 118deg,rgba(255,255,255,0) 186deg,rgba(150,255,190,.24) 212deg,rgba(255,170,120,.30) 238deg,rgba(210,140,255,.30) 262deg,rgba(110,200,255,.26) 286deg,rgba(255,255,255,0) 312deg,rgba(255,255,255,0) 360deg)}   /* spectrum wedges that stay put against the light; only the transform moves, so no repaint */
.cdrot::after{content:"";position:absolute;left:50%;top:5px;width:6px;height:16px;margin-left:-3px;border-radius:2px;background:var(--red);
  box-shadow:0 0 6px rgba(203,74,54,.5)}
.cdrot .lbl{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.cdhole{position:absolute;inset:34%;border-radius:50%;pointer-events:none;z-index:2;
  background:radial-gradient(circle closest-side,transparent 0 55%,rgba(112,120,130,.85) 55% 56.6%,rgba(255,255,255,.94) 56.6% 70%,rgba(105,113,123,.7) 70% 71.6%,rgba(250,251,252,.9) 71.6% 82%,#9eb0bf 82% 85.5%,#1f2524 85.5% 100%);
  box-shadow:0 0 0 1px #6b727b,0 0 0 2px rgba(255,255,255,.7)}
.hubbtn{position:absolute;border-radius:50%;z-index:6;touch-action:none;cursor:pointer;display:flex;align-items:center;justify-content:center;
  background:none;box-shadow:none}
.hubbtn::before{content:"";position:absolute;inset:-16px}
.hubbtn svg{width:34px;height:34px;fill:#ff5a45;filter:drop-shadow(0 0 5px rgba(224,90,70,.8))}
.hubbtn.on{box-shadow:0 5px 9px rgba(0,0,0,.45),0 0 0 3px #e9ebee,0 0 0 4px #8f959e,inset 0 1px 1px rgba(255,255,255,.3)}
.hubbtn.down{transform:scale(.96)}
.spn{position:absolute;inset:0;pointer-events:none}
.spn svg{width:100%;height:100%;fill:none;filter:none}
.cdlid{visibility:hidden;position:absolute;border-radius:50%;overflow:hidden;z-index:7;pointer-events:none}
.lidp{position:absolute;inset:-2px;transform:translateX(-110%);
  background:linear-gradient(115deg,rgba(248,250,252,.93),rgba(218,224,230,.9) 55%,rgba(240,243,246,.94));
  clip-path:polygon(0 0,100% 0,100% 100%,22% 100%,0 78%);

ui.cuesChanged(); ui.loopChanged(); ui.playState(false); ui.varChanged();
(async () => {   // bring the saved shelf back
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* ignore */ }
  const rows = (await dbAll()).sort((a, b) => a.seq - b.seq); if (!rows.length) return;
  rows.forEach(r => {
    if (!r.file || Q.list.some(t => t.key === r.key)) return;
    const item = { file: r.file, name: r.name, key: r.key, dur: r.dur || 0, peaks: null, seq: r.seq }; Q.list.push(item);
    if (!item.dur) { try { const a = new Audio(), u = URL.createObjectURL(r.file); a.preload = 'metadata'; a.onloadedmetadata = () => { if (isFinite(a.duration)) { item.dur = a.duration; dbPut(item); } URL.revokeObjectURL(u); ui.libBuild(); }; a.onerror = () => URL.revokeObjectURL(u); a.src = u; } catch (e) { /* ignore */ } }
  });
  if (Q.idx < 0 && Q.list.length) { let lk = null; try { lk = localStorage.getItem('iridescent.last'); } catch (e) { /* ignore */ } loadTrack(Math.max(0, Q.list.findIndex(t => t.key === lk)), false); }
  ui.libBuild();
})();
requestAnimationFrame(tick);

})();
